# This is a Declarative Automation Bundle definition for my_project.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: ecommerce_lakehouse_bundle
  uuid: cfbcf6d1-b1b9-4579-a910-fc2a755225ea

include:
  - resources/*.yml


# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-3a92d4ac-479d.cloud.databricks.com
    variables:
      catalog: workspace
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://dbc-3a92d4ac-479d.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/ahmedalaeddinebaatour@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/ahmedalaeddinebaatour@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: prod
    permissions:
      - user_name: ahmedalaeddinebaatour@gmail.com
        level: CAN_MANAGE
